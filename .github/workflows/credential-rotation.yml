name: Credential rotation

# Rotates the server-side credentials this repository owns (see
# scripts/rotate-credentials.js) and records the superseded values in the
# encrypted vault, so a failure rolls back automatically and a maintainer can
# still roll back manually afterwards.
#
# Runs on the first of every month and on demand. It is a no-op until the
# repository secrets below are configured, so an unconfigured fork stays green:
#
#   CREDENTIAL_VAULT_KEY  passphrase for the encrypted vault (required to apply)
#   VERCEL_TOKEN          Vercel API token (optional: pushes the new values)
#   VERCEL_PROJECT_ID     Vercel project id
#   plus the usual VITE_SUPABASE_*, RESEND_*, ADMIN_SESSION_SECRET values that
#   scripts/sync-vercel-env.js reads from the generated environment.

on:
  schedule:
    # 03:17 UTC on the first of each month.
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the rotation (uncheck for a dry run)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: credential-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CREDENTIAL_VAULT_KEY: ${{ secrets.CREDENTIAL_VAULT_KEY }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The vault carries the rotation history across runs; without it a rollback
      # would have no previous value to restore.
      - name: Restore credential vault
        uses: actions/cache@v4
        with:
          path: .nexus-credentials
          key: credential-vault-${{ github.run_id }}
          restore-keys: credential-vault-

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Rotate credentials
        if: ${{ env.CREDENTIAL_VAULT_KEY != '' }}
        run: node scripts/rotate-credentials.js --apply --due 30

      - name: Push the rotated values to Vercel
        if: ${{ env.CREDENTIAL_VAULT_KEY != '' && env.VERCEL_TOKEN != '' }}
        run: npm run env:generate && node scripts/sync-vercel-env.js

      - name: Note skipped rotation
        if: ${{ env.CREDENTIAL_VAULT_KEY == '' }}
        run: echo "::notice::CREDENTIAL_VAULT_KEY is not set; skipping rotation."
