<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Nexus logo">
  <style>
    @keyframes nexus-pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    @keyframes nexus-twinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    .neon-glow { animation: nexus-pulse 3.2s ease-in-out infinite; }
    .sparkle { animation: nexus-twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .sparkle.delay { animation-delay: 1.1s; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1024"/>
      <stop offset="100%" stop-color="#05070f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2"/>
    </filter>
    <filter id="strongGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Badge -->
  <rect x="3" y="3" width="250" height="250" rx="46" ry="46" fill="url(#bg)"/>
  <rect x="3" y="3" width="250" height="250" rx="46" ry="46" fill="none" stroke="url(#neon)" stroke-width="1.6" opacity="0.75"/>

  <!-- Animated outer glow of the icon -->
  <g class="neon-glow" filter="url(#strongGlow)" fill="none" stroke="url(#neon)" stroke-width="7" stroke-linecap="round">
    <path d="M70 92 C70 64 100 64 128 92 C156 120 186 120 186 92 C186 64 156 64 128 92 C100 120 70 120 70 92 Z"/>
  </g>

  <!-- Crisp neon icon -->
  <g fill="none" stroke="url(#neon)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Infinity loop (two interlocking chat bubbles) -->
    <path d="M70 92 C70 64 100 64 128 92 C156 120 186 120 186 92 C186 64 156 64 128 92 C100 120 70 120 70 92 Z"/>
    <!-- Left chat-bubble tail -->
    <path d="M70 110 L58 126 L82 116"/>
    <!-- Right chat-bubble tail -->
    <path d="M186 110 L198 126 L174 116"/>
    <!-- Upward arrow -->
    <path d="M128 138 L128 46"/>
    <path d="M110 64 L128 46 L146 64"/>
  </g>

  <!-- Sparkles -->
  <g class="sparkle" fill="#22d3ee">
    <path d="M192 58 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z"/>
  </g>
  <g class="sparkle delay" fill="#ec4899">
    <path d="M64 60 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2 z"/>
  </g>

  <!-- Wordmark -->
  <text x="128" y="172" text-anchor="middle"
        font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
        font-size="36" font-weight="900" letter-spacing="2.5"
        fill="url(#neon)" filter="url(#softGlow)">NEXUS</text>

  <!-- Circuit pattern -->
  <g stroke="url(#neon)" stroke-width="1" fill="none" opacity="0.55">
    <path d="M52 208 H80 L92 220 H120"/>
    <path d="M136 220 H164 L176 208 H204"/>
    <path d="M128 200 V220"/>
  </g>
  <g fill="#22d3ee" opacity="0.85">
    <circle cx="80" cy="208" r="2.2"/>
    <circle cx="120" cy="220" r="1.8"/>
    <circle cx="128" cy="200" r="2.2"/>
    <circle cx="176" cy="208" r="1.8"/>
  </g>
  <g fill="#ec4899" opacity="0.85">
    <circle cx="92" cy="220" r="1.6"/>
    <circle cx="164" cy="220" r="1.6"/>
  </g>
</svg>
